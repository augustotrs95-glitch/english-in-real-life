<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English in Real Life | Demo experimental V03</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5fa;color:#192743;font:16px system-ui}header,main,nav,aside{max-width:960px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}small,.muted{color:#58647b}button{font:inherit;cursor:pointer;border:1px solid #d4d5e1;border-radius:14px;padding:14px;background:white;color:#192743;min-height:48px}button:disabled{opacity:.55;cursor:default}nav button[aria-current="page"]{background:#e9e0ff;border-color:#8255d8;font-weight:700}button:focus-visible{outline:3px solid #6540b5;outline-offset:3px}button.primary{background:#6540b5;color:white;border:0;font-weight:bold}section{background:white;border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:0 6px 24px #19274309}.hero{background:linear-gradient(125deg,#192743,#30345c);color:white;padding:clamp(24px,5vw,48px)}.hero small{color:#ded9f9}.hero button{background:#e9ddff;color:#302052}h1{font-size:clamp(25px,5vw,40px);margin:12px 0}h2{margin-top:0}p{line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:16px}.grid section{margin:0;border:1px solid #e5e5ef}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{flex:1}progress{width:100%;accent-color:#8255d8;height:12px}.choices{display:grid;gap:10px}.choices button{text-align:left}.tag{background:#ffdfd4;color:#713e32;border-radius:20px;padding:5px 10px;display:inline-block}aside{background:#fff0e9;border-radius:12px;font-size:14px} @media(max-width:430px){header,main,nav,aside{padding:12px}section{padding:18px}header{gap:8px}header strong{font-size:14px}}</style><link rel="stylesheet" href="../visual-ux/engagement.css"><header><strong>ENGLISH<span style="color:#8255d8"> IN REAL LIFE</span></strong><small>Demo V03</small></header><aside><strong>Versão experimental — não é o produto oficial.</strong> Missões, revisão espaçada e progresso local em teste. Áudio sintético; sem avaliação fonética, conta ou cobrança. Não inclui o laboratório anatômico.</aside><nav aria-label="Navegação"><button onclick="home()">Hoje</button><button onclick="review()">Revisar</button><button onclick="stats()">Progresso</button></nav><main id="app"></main><script>
const items=[{id:'th',name:'TH · think',q:'Qual palavra começa com /θ/?',a:['think','sink'],correct:0,tip:'Em think, a ponta da língua toca levemente a região dos dentes. O ar passa sem voz.',phrase:'I think so.'},{id:'vowel',name:'ship × sheep',q:'Qual palavra tem a vogal /iː/?',a:['ship','sheep'],correct:1,tip:'Sheep tem /iː/; ship tem /ɪ/. A diferença não é apenas duração.',phrase:'Look at the sheep.'},{id:'ae',name:'cat · /æ/',q:'Qual palavra contém /æ/?',a:['cut','cat'],correct:1,tip:'Cat tem /æ/, uma vogal anterior aberta.',phrase:'The cat is here.'}];
const follow={th:{q:'Qual palavra termina com /θ/?',a:['math','mass'],correct:0},vowel:{q:'Qual palavra tem /iː/?',a:['sit','seat'],correct:1},ae:{q:'Qual palavra contém /æ/?',a:['cup','cap'],correct:1}};
const key='eirl-design-v03';let data={done:0,answers:0,correct:0,items:{}},storageWarning=false;try{const x=JSON.parse(localStorage.getItem(key));if(x&&Number.isInteger(x.done)&&x.done>=0&&Number.isInteger(x.answers)&&Number.isInteger(x.correct)&&x.correct>=0&&x.correct<=x.answers&&x.answers===2*x.done&&x.items&&typeof x.items==='object'&&Object.entries(x.items).every(([id,v])=>items.some(t=>t.id===id)&&v&&Number.isInteger(v.level)&&v.level>=0&&v.level<=4&&Number.isFinite(v.due)))data=x}catch{};let current,step=0,answered=false,firstCorrect=false;const app=document.querySelector('#app');const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch{storageWarning=true}};const due=()=>items.filter(x=>data.items[x.id]&&data.items[x.id].due<=Date.now()).sort((a,b)=>data.items[a.id].due-data.items[b.id].due);
function mark(n){document.querySelectorAll('nav button').forEach((b,i)=>{if(i===n)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}function stopAudio(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function home(){stopAudio();mark(0);app.innerHTML=`<section class="hero"><small>SUA MISSÃO REAL · ~2 MIN</small><h1>Um pequeno passo.<br>Inglês para a vida real.</h1><p>${due().length?'Você tem uma revisão pronta.':'Aprenda um contraste de som e use uma frase real.'}</p><button class="primary" onclick="start('${(due()[0]||items.find(x=>!data.items[x.id])||items.slice().sort((a,b)=>data.items[a.id].due-data.items[b.id].due)[0]).id}')">Começar missão</button></section><div class="grid"><section><span class="tag">Lock in</span><h2>Revisão inteligente</h2><p>${due().length} alvo(s) para revisar agora.</p><button onclick="review()">Ver revisão</button></section><section><h2>Seu progresso</h2><p>${data.done} missões concluídas</p><button onclick="stats()">Ver detalhes</button></section></div><p class="muted">Sem sequência obrigatória. Volte quando quiser. ${storageWarning?'Não foi possível salvar neste dispositivo.':''}</p>`}
function start(id){const selected=items.find(x=>x.id===id);if(!selected)return;stopAudio();mark(-1);current=selected;step=0;answered=false;firstCorrect=false;render()}
function render(){const names=['Recognise','Explore','Apply','Lock in'];let body='';if(step===0)body=`<h1>${current.q}</h1><div class="choices">${current.a.map((a,i)=>`<button onclick="answer(${i})">${a}</button>`).join('')}</div><p id="feedback" role="status"></p><button id="next" class="primary" disabled onclick="advance()">Continuar</button>`;if(step===1)body=`<h1>${current.name}</h1><p>${current.tip}</p><button onclick="say('${current.a[current.correct]}')">Ouvir voz do dispositivo</button><p class="muted">Áudio sintético demonstrativo; não é modelo fonético validado.</p><button class="primary" onclick="advance()">Praticar</button>`;if(step===2)body=`<h1>${current.phrase}</h1><p>Fale a frase em voz alta. Repita no seu ritmo.</p><button onclick="say('${current.phrase}')">Ouvir exemplo</button><p>Sem avaliação automática da sua fala nesta versão.</p><button class="primary" onclick="advance()">Concluir prática</button>`;if(step===3)body=`<h1>Hora de lembrar</h1><p>${follow[current.id].q}</p><div class="choices">${follow[current.id].a.map((a,i)=>`<button onclick="finish(${i})">${a}</button>`).join('')}</div>`;app.innerHTML=`<section><button onclick="home()">Sair da missão</button><p><small>${names[step]} · ${step+1}/4</small></p><progress aria-label="Etapa da missão" max="4" value="${step+1}"></progress>${body}<p id="audioStatus" role="status"></p></section>`}
function answer(i){if(step!==0||answered||!Number.isInteger(i)||i<0||i>1)return;answered=true;firstCorrect=i===current.correct;document.querySelector('#feedback').textContent=firstCorrect?'Correto!':'A resposta é '+current.a[current.correct]+'.';document.querySelector('#next').disabled=false;document.querySelectorAll('.choices button').forEach(b=>b.disabled=true)}
function advance(){if(step===0&&!answered||step>=3)return;stopAudio();step++;render()}
function finish(i){if(step!==3||!Number.isInteger(i)||i<0||i>1)return;step=4;const f=follow[current.id],ok=i===f.correct;data.answers+=2;data.correct+=Number(ok)+Number(firstCorrect);data.done++;let old=data.items[current.id]||{level:0};let level=ok&&firstCorrect?Math.min(old.level+1,4):0;const early=old.due>Date.now()&&ok&&firstCorrect;if(early)level=old.level;data.items[current.id]={level,due:early?old.due:Date.now()+[0,1,3,7,14][level]*86400000};save();app.innerHTML=`<section><span class="tag">Missão concluída</span><h1>${ok?'Você lembrou!':'Mais uma oportunidade de revisar'}</h1><p>Resposta: ${f.a[f.correct]}. ${early?'Calendário de revisão mantido.':level?'Próxima revisão em '+[0,1,3,7,14][level]+' dia(s).':'Revisão disponível agora.'}</p><button class="primary" onclick="home()">Finalizar por hoje</button> <button onclick="review()">Revisar mais</button></section>`}
function review(){stopAudio();mark(1);app.innerHTML=`<section><h1>Revisão</h1><p>${due().length} alvo(s) com revisão disponível. Você também pode praticar antecipadamente, sem adiantar o calendário se acertar.</p><div class="choices">${items.map(x=>`<button onclick="start('${x.id}')">${x.name} · ${!data.items[x.id]?'Novo':data.items[x.id].due<=Date.now()?'Revisar agora':'Agendado para '+new Date(data.items[x.id].due).toLocaleDateString('pt-BR')}</button>`).join('')}</div></section>`}
function stats(){stopAudio();mark(2);app.innerHTML=`<section><h1>Progresso real</h1><div class="grid"><p><strong>${data.done}</strong><br>Missões completas</p><p><strong>${data.correct}/${data.answers}</strong><br>Respostas corretas</p><p><strong>${Object.keys(data.items).length}/3</strong><br>Alvos praticados</p><p><strong>${Object.values(data.items).filter(x=>x.level>=3).length}/3</strong><br>Alvos em consolidação avançada</p></div><p>Acertos em missões completas, não uma nota de pronúncia. Consolidação avançada indica três etapas de revisão bem-sucedidas, não domínio comprovado.</p><button onclick="if(confirm('Apagar progresso local?')){data={done:0,answers:0,correct:0,items:{}};save();home()}">Limpar dados locais</button></section>`}
function say(t){let s=document.querySelector('#audioStatus');if(!('speechSynthesis'in window)){s.textContent='Áudio indisponível neste navegador.';return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';const voice=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-')==='en-US');if(voice)u.voice=voice;u.onerror=()=>s.textContent='Não foi possível reproduzir o áudio.';speechSynthesis.speak(u)}catch{s.textContent='Áudio indisponível.'}}
const observer=new MutationObserver(()=>{const h=app.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}});observer.observe(app,{childList:true});home();
</script></html>
